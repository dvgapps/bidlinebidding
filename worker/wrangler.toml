# Cloudflare Worker for Bidline Bidding (free plan is enough). See README.md for the one-time setup.
name = "bidline-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Exact origin(s) of the app on GitHub Pages (comma separated), scheme + host only.
[vars]
ALLOWED_ORIGIN = "https://YOUR-USER.github.io"

# Create with:  npx wrangler kv namespace create BIDLINE   -> paste the id below
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file): PASSPHRASE, TOKEN_SECRET, and later IPA_EMPLOYEE_ID
#   npx wrangler secret put PASSPHRASE
